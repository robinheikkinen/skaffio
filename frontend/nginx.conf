server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # CSP — tillåt bara egen origin + inline CSS/JS (Vite gör inline), Google Fonts,
    # och data:-bilder från AI-kameran. Justera om du lägger till extern CDN senare.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.staik.se https://api.anthropic.com; frame-ancestors 'self'" always;

    # Default proxy-inställningar för alla API-anrop
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cloudflare Access headers — måste skickas vidare explicit till backend
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    proxy_buffering off;

    # Dedikerad block för PDF-uppladdning — Claude/Qwen one-shot kan ta 90s
    location = /api/images/upload-pdf {
        proxy_pass http://api:8000/api/images/upload-pdf;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # AI-extraktion från bild — också potentiellt långsamt
    location = /api/ai/extract-from-image {
        proxy_pass http://api:8000/api/ai/extract-from-image;
        client_max_body_size 50M;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # AI-måltidsplanering kan ta tid med stor receptkatalog
    location = /api/ai/plan {
        proxy_pass http://api:8000/api/ai/plan;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Övriga API-anrop
    location /api/ {
        proxy_pass http://api:8000/api/;
        client_max_body_size 50M;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://api:8000/uploads/;
        proxy_cache_valid 200 1d;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
